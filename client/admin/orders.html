<!DOCTYPE html>
<html lang="mr" translate="no" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <title>ऑर्डर्स व पॅकिंग — महालक्ष्मी किराणा / Orders & Packing</title>
  <meta name="description" content="Mahalaxmi Kirana Store order fulfillment queue, packing checklist, and delivery dispatch.">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Router Guard -->
  <script src="../js/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/router-guard.js"></script>
</head>
<body>

  <div id="app-shell">
    <!-- Top Mode Switch Tabs: Live Queue vs Packing List -->
    <div class="tab-scroll-row" id="ordersModeTabs" role="tablist">
      <button type="button" class="btn btn-secondary active" id="tabQueueBtn" style="border-radius:10px;">
        📦 थेट ऑर्डर्स (Live Queue)
      </button>
      <button type="button" class="btn btn-secondary" id="tabPackingBtn" style="border-radius:10px;">
        📋 पॅकिंग यादी (Packing List)
      </button>
    </div>

    <!-- 1. LIVE QUEUE VIEW -->
    <div id="ordersQueueView">
      <!-- Search & Filters -->
      <div class="filter-bar">
        <div class="filter-search-wrap">
          <span class="search-icon-left">🔍</span>
          <input
            type="search"
            class="filter-search-input"
            id="orderSearchInput"
            placeholder="ऑर्डर क्र., नाव, फोन नंबर किंवा गाव शोधा..."
            autocomplete="off"
            aria-label="Search orders"
          />
        </div>
        <!-- Status Filter Chips -->
        <div class="chip-scroll-row" id="statusFilterRow">
          <button type="button" class="chip active" data-status-chip="all">
            <span>सर्व / All</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;">(0)</span>
          </button>
          <button type="button" class="chip" data-status-chip="new">
            <span>🔔 नवीन / New</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;color:#dc2626;">(0)</span>
          </button>
          <button type="button" class="chip" data-status-chip="confirmed">
            <span>स्वीकृत / Confirmed</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;">(0)</span>
          </button>
          <button type="button" class="chip" data-status-chip="packed">
            <span>पॅक / Packed</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;">(0)</span>
          </button>
          <button type="button" class="chip" data-status-chip="out_for_delivery">
            <span>🚚 रवाना / Dispatched</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;">(0)</span>
          </button>
          <button type="button" class="chip" data-status-chip="delivered">
            <span>✅ पूर्ण / Delivered</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;">(0)</span>
          </button>
          <button type="button" class="chip" data-status-chip="cancelled">
            <span>रद्द / Cancelled</span>
            <span class="chip-count font-bold" style="font-size:0.75rem;">(0)</span>
          </button>
        </div>
      </div>

      <!-- Orders List Target -->
      <div id="ordersListContainer"></div>
    </div>

    <!-- 2. PACKING LIST VIEW -->
    <div id="packingListView" style="display:none;">
      <div id="packingListContainer"></div>
    </div>
  </div>

  <!-- Core & Shared Component Scripts -->
  <script src="js/core/dom.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/toast.js"></script>
  <script src="js/core/net.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/components/bottom-sheet.js"></script>
  <script src="js/components/shell.js"></script>
  <script src="js/components/stat-card.js"></script>
  <script src="js/components/data-list.js"></script>
  <script src="js/components/filter-bar.js"></script>
  <script src="js/components/badge.js"></script>
  <script src="js/components/stepper.js"></script>
  <script src="js/components/confirm.js"></script>
  <script src="js/components/skeleton.js"></script>
  <script src="js/components/empty-state.js"></script>
  <script src="js/components/chart.js"></script>

  <!-- Page Logic -->
  <script src="js/pages/orders.js"></script>
</body>
</html>
