<!DOCTYPE html>
<html lang="mr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>डॅशबोर्ड — महालक्ष्मी किराणा / Admin Dashboard</title>
  <meta name="description" content="Mahalaxmi Kirana Store live owner dashboard. Real-time orders, revenue, inventory, and delivery slots.">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Router Guard (Synchronous auth enforcement) -->
  <script src="../js/config.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/router-guard.js"></script>
</head>
<body>

  <!-- App Shell Root -->
  <div id="app-shell">
    <!-- Enable Audio Banner (Unlocks HTML5 Web Audio on first tap) -->
    <div id="audioBanner" style="display:none;background:#fef3c7;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;margin-bottom:16px;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:1.5rem;">🔔</span>
        <div>
          <strong style="color:#92400e;font-size:0.95rem;display:block;">नवीन ऑर्डर ऑडिओ इशारा सुरू करा / Enable Order Alerts</strong>
          <span style="color:#78350f;font-size:0.8rem;">नवीन ऑर्डर आल्यावर फोनवर आवाज वाजण्यासाठी एकदा क्लिक करा.</span>
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="enableAudioBtn" style="flex-shrink:0;">
        🔊 सुरू करा / Enable
      </button>
    </div>

    <!-- Main Dynamic Content Container -->
    <div id="dashboardContent">
      <!-- Skeleton Loading Initial State -->
      <div class="flex flex-col gap-4">
        <div class="skeleton" style="height: 52px; width: 100%; border-radius: 12px;"></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px;">
          <div class="skeleton" style="height: 110px; border-radius: 14px;"></div>
          <div class="skeleton" style="height: 110px; border-radius: 14px;"></div>
          <div class="skeleton" style="height: 110px; border-radius: 14px;"></div>
          <div class="skeleton" style="height: 110px; border-radius: 14px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Core & Shared Component Scripts -->
  <script src="js/core/dom.js"></script>
  <script src="js/core/format.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/toast.js"></script>
  <script src="js/core/net.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/components/bottom-sheet.js"></script>
  <script src="js/components/shell.js"></script>
  <script src="js/components/stat-card.js"></script>
  <script src="js/components/data-list.js"></script>
  <script src="js/components/filter-bar.js"></script>
  <script src="js/components/badge.js"></script>
  <script src="js/components/stepper.js"></script>
  <script src="js/components/confirm.js"></script>
  <script src="js/components/skeleton.js"></script>
  <script src="js/components/empty-state.js"></script>
  <script src="js/components/chart.js"></script>

  <!-- Page Logic -->
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
