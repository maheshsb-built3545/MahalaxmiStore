<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#04251a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(245, 158, 11, 0.25)" stroke-width="4"/>
  
  <!-- Icon Group -->
  <g filter="url(#glow)">
    <!-- Grocery Basket / Bag Base -->
    <path d="M140 220 L372 220 L346 390 C344 404 332 414 318 414 L194 414 C180 414 168 404 166 390 Z" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="8"/>
    <!-- Handles -->
    <path d="M190 220 C190 145 322 145 322 220" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
    <!-- Golden Leaf / Sprout -->
    <path d="M256 120 C256 80 295 70 315 70 C315 95 300 130 256 145 Z" fill="url(#gold)"/>
    <!-- Central Monogram M -->
    <path d="M195 370 L195 260 L240 330 C248 342 264 342 272 330 L317 260 L317 370" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="468" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="34" fill="#fbbf24" letter-spacing="1">महालक्ष्मी किराणा</text>
</svg>
